name: Publish initial release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/initial-release.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build plugin
        run: |
          npm test
          npm run build

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./manifest.json').version")"
          gh release create "$version" \
            --target "$GITHUB_SHA" \
            --title "$version" \
            --notes "Initial public release of Image Order Reverser." \
            main.js manifest.json
