name: Publish 0.2.0 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-0.2.0.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "18bcf0ded84f95901390bdc50cb6e798cf9b067e"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build plugin
        run: |
          npm test
          npm run build

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "0.2.0" \
            --target "18bcf0ded84f95901390bdc50cb6e798cf9b067e" \
            --title "0.2.0" \
            --notes "Add Reverse image order to the active note's three-dot options menu." \
            main.js manifest.json
