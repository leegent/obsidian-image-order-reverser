name: Publish 0.2.1 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-0.2.1.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "b5db8d7bc71317f86e207c749f31c4abf2e154fc"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build plugin
        run: |
          npm test
          npm run build

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "0.2.1" \
            --target "b5db8d7bc71317f86e207c749f31c4abf2e154fc" \
            --title "0.2.1" \
            --notes "Add automatic Chinese and English localization. Keep the command available across note switches, target the correct note, and update Markdown files correctly from Reading view." \
            main.js manifest.json
