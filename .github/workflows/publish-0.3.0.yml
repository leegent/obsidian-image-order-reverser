name: Publish 0.3.0 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-0.3.0.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "a813557314375cc9b349f6d9925ac88640f5ae41"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build plugin
        run: |
          npm test
          npm run build

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "0.3.0" \
            --target "a813557314375cc9b349f6d9925ac88640f5ae41" \
            --title "0.3.0" \
            --notes "Reverse image and video embeds together in one shared sequence. Supports Obsidian video embeds for MKV, MOV, MP4, OGV, and WebM while preserving all existing safety exclusions." \
            main.js manifest.json
